<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Openbtk AI ecosystem: Openbtk AI at the center, connected to Openbtk today, with more components to come">
  <defs>
    <linearGradient id="eco-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes eco-flow { to { stroke-dashoffset: -28; } }
    @keyframes eco-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .eco-edge-live { stroke-dasharray: 5 9; animation: eco-flow 1.8s linear infinite; }
    .eco-node-pulse { animation: eco-pulse 2.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .eco-edge-live, .eco-node-pulse { animation: none; }
    }
  </style>

  <!-- hub -> openbtk (live, solid) -->
  <line x1="190" y1="150" x2="372" y2="92" stroke="url(#eco-grad)" stroke-width="2.5" class="eco-edge-live"/>
  <!-- hub -> future (dashed, not yet active) -->
  <line x1="190" y1="172" x2="372" y2="236" stroke="#64748b" stroke-width="2" stroke-dasharray="3 7"/>

  <!-- hub: Openbtk AI -->
  <circle cx="140" cy="160" r="62" fill="#131c33" stroke="url(#eco-grad)" stroke-width="3"/>
  <text x="140" y="153" text-anchor="middle" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Openbtk</text>
  <text x="140" y="175" text-anchor="middle" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">AI</text>
  <text x="140" y="195" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="0.04em">ECOSYSTEM</text>

  <!-- node: Openbtk (live component) -->
  <circle class="eco-node-pulse" cx="420" cy="90" r="46" fill="#131c33" stroke="url(#eco-grad)" stroke-width="2.5"/>
  <text x="420" y="85" text-anchor="middle" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Openbtk</text>
  <text x="420" y="102" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="10.5">toolkit · v0.5</text>

  <!-- node: future component (placeholder) -->
  <circle cx="420" cy="238" r="36" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="420" y="233" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600">+</text>
  <text x="420" y="251" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="9.5">more, in time</text>
</svg>
